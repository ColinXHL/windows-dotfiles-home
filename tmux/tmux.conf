# Keep tmux on its default prefix so the input layers stay distinct:
# GlazeWM Alt, WezTerm Ctrl-a, tmux Ctrl-b, and Neovim Space.
set -g prefix C-b

set -g default-terminal "tmux-256color"
set -as terminal-overrides ',xterm*:Tc:Ms=\E]52;%p1%s;%p2%s\007'
set -g focus-events on
set -sg escape-time 10

set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi

# Trusted development VMs may write the Windows clipboard through OSC 52.
# Change this to "external" on hosts where terminal applications are untrusted.
set -s set-clipboard on
