vsync = true
idle = true
frame = "none"
srgb = true

[font]
size = 12.0
hinting = "full"
edging = "subpixelantialias"
normal = [
  { family = "JetBrainsMono Nerd Icons", style = "Regular" },
  { family = "0xProto Nerd Font Mono", style = "Regular" },
  { family = "Maple Mono NF CN", style = "Regular" },
  { family = "Segoe UI Emoji" },
]

[box-drawing]
mode = "native"
