watch_config_changes: True
enable_logging: True
enable_ipc_server: True
rendering_backend: V2

global:
  border_width: 3
  border_offset: -1
  border_radius: Auto
  border_z_order: AboveWindow
  follow_native_border: True
  initialize_delay: 200
  unminimize_delay: 150

  active_color:
    colors: ["#00868d", "#40a4aa", "#80c3c6", "#40a4aa"]
    direction: 45deg
  inactive_color: "#27474a99"

  komorebi_colors:
    stack_color: "#40a4aa"
    monocle_color: "#80c3c6"
    floating_color: "#e5b567"
    enabled: False

  animations:
    active: []
    inactive: []
    fps: 30
    enabled: False

  effects:
    active:
      - type: Glow
        blur: 6.0
        spread: 0.0
        opacity: 0.65
    inactive: []
    enabled: True

window_rules:
  - match: Class
    name: "Windows.UI.Core.CoreWindow"
    enabled: False
  - match: Class
    name: "XamlExplorerHostIslandWindow"
    enabled: False
  - match: Process
    name: "tacky-borders"
    enabled: False
  - match: Process
    name: "yasb"
    enabled: False
  - match: Process
    name: "TranslucentTB"
    enabled: False
  - match: Process
    name: "memreduct"
    enabled: False
  - match: Process
    name: "BetterGI"
    enabled: False
  - match: Process
    name: "zebar"
    enabled: False
  - match: Title
    name: "Picture-in-Picture"
    enabled: False
  - match: Process
    name: "seelen-ui"
    enabled: False
